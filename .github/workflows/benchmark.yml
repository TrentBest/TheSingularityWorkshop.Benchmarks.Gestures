name: Gestures benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: full
        type: choice
        options: [smoke, full]
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.Benchmarks.Gestures
      - uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Gestures
          ref: f350ebfa21669eb65c8bf898c2f1d0353683426e
          path: TheSingularityWorkshop.Gestures
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Capture benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TheSingularityWorkshop.Benchmarks.Gestures/results/environment
          {
            echo "benchmark_repository=TrentBest/TheSingularityWorkshop.Benchmarks.Gestures"
            echo "benchmark_commit=$(git -C TheSingularityWorkshop.Benchmarks.Gestures rev-parse HEAD)"
            echo "source_repository=TrentBest/TheSingularityWorkshop.Gestures"
            echo "source_commit=$(git -C TheSingularityWorkshop.Gestures rev-parse HEAD)"
            echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_os=$(uname -a)"
            echo
            dotnet --info
            echo
            lscpu
          } > TheSingularityWorkshop.Benchmarks.Gestures/results/environment/manifest.txt
      - name: Build benchmark harness
        run: dotnet build TheSingularityWorkshop.Benchmarks.Gestures/src/TheSingularityWorkshop.Benchmarks.Gestures/TheSingularityWorkshop.Benchmarks.Gestures.csproj --configuration Release
      - name: Run full Gestures measurements
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.Gestures/src/TheSingularityWorkshop.Benchmarks.Gestures/TheSingularityWorkshop.Benchmarks.Gestures.csproj -c Release -- --filter '*' --exporters json markdown
      - name: Run smoke benchmarks
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: |
          set -euo pipefail
          project=TheSingularityWorkshop.Benchmarks.Gestures/src/TheSingularityWorkshop.Benchmarks.Gestures/TheSingularityWorkshop.Benchmarks.Gestures.csproj
          dotnet run --project "$project" -c Release -- --filter '*ChainHierarchyBenchmarks*' --job Dry
          dotnet run --project "$project" -c Release -- --filter '*BranchingHierarchyBenchmarks*' --job Dry
          dotnet run --project "$project" -c Release -- --filter '*CrowdGestureEvaluationBenchmarks*' --job Dry
      - name: Upload BenchmarkDotNet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestures-benchmark-artifacts
          path: |
            BenchmarkDotNet.Artifacts/**
            TheSingularityWorkshop.Benchmarks.Gestures/results/environment/**
          if-no-files-found: warn
